name: Update index & publish site

# Runs on every push to main (and manually from the Actions tab).
# Both jobs live in one workflow because commits pushed with GITHUB_TOKEN
# (like the regenerated index.qmd) do not trigger other workflows.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # commit the regenerated index.qmd
  pages: write      # deploy to GitHub Pages
  id-token: write   # required by actions/deploy-pages

# Never run two publishes at once. Don't cancel a deploy that is already
# in progress (GitHub's recommendation for Pages); queue the next one instead.
concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          environments: default

      - name: Regenerate index.qmd from projects.yaml
        run: pixi run update-index

      - name: Commit index.qmd if it changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate index.qmd from projects.yaml"
          file_pattern: index.qmd

  build:
    needs: update-index
    runs-on: ubuntu-latest
    steps:
      # Check out the branch head so the
      # index.qmd commit from the previous job is included.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          environments: docs

      - name: Render site
        run: pixi run -e docs quarto render

      - name: Upload site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Deploys straight to Pages. (Pushing to a gh-pages branch with GITHUB_TOKEN
  # does not trigger the Pages build, so the site would never update.)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
