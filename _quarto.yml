project:
  type: website
  output-dir: _site
  resources:
    - CNAME

website:
  title: "Dr. Suyash Naik"
  description: "Quantitative Life Scientist. PhD at IST Austria. Interested in biotech, data science, and consulting."
  site-url: https://suyashnaik.com
  favicon: assets/img/favicon.ico
  
  navbar:
    pinned: true
    left:
      - text: "Home"
        href: index.qmd

      - text: "Projects"
        menu:
          - text: "All projects"
            href: projects/index.qmd
          - text: "Efficiency Pipeline"
            href: projects/efficiency-pipeline.qmd
          - text: "DeskPets"
            href: projects/desk-pets.qmd
      - text: "CV"
        href: cv.qmd
      - text: "Art"
        href: art/index.qmd
    right:
      - icon: github
        href: https://github.com/Suyash-Naik
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/suyash-naik-s167s/
        aria-label: LinkedIn
      - icon: twitter
        href: https://twitter.com/SuyashNaik6
        aria-label: Twitter

  sidebar:
    - id: projects
      title: "Projects"
      style: docked
      contents:
        - text: "All projects"
          href: projects/index.qmd
        - text: "Efficiency Pipeline"
          href: projects/efficiency-pipeline.qmd
        - section: "DeskPets"
          href: projects/desk-pets.qmd
          contents:
            - text: "Documentation ↗"
              href: https://suyashnaik.com/DeskPets/
            - text: "Getting started ↗"
              href: https://github.com/Suyash-Naik/DeskPets/releases/download/v0.1.1/DeskPets-Setup-0.1.1.exe
            - text: "How it works ↗"
              href: https://suyashnaik.com/DeskPets/internals/how-it-works.html

  page-footer:
    center: "© 2026 Suyash Naik · Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [lux, assets/css/custom.scss]
      dark: [darkly, assets/css/custom.scss]
    toc: false
    anchor-sections: false
    smooth-scroll: true
    grid:
      body-width: 860px
      margin-width: 180px
    lightbox: auto


#this website also requires quarto, quarto-ext fontawesome, quarto-ext lightbox to be installed.